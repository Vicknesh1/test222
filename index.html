<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoundryFlow — Foundry Production Form</title>
  <style>
    :root{
      --bg:#f4f7f5; --panel:#ffffff; --text:#16201b; --muted:#6d7872;
      --line:#dfe7e2; --brand:#157347; --brand2:#0f5132; --soft:#e9f6ef;
      --warn:#b26a00; --danger:#b42318; --shadow:0 14px 35px rgba(21,50,35,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app-shell{min-height:100vh;display:flex}
    .sidebar{width:250px;background:#11251b;color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
    .brand{display:flex;gap:11px;align-items:center;padding:8px 10px}
    .brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#43bf7a,#0f5132);display:grid;place-items:center;font-weight:900}
    .brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#a8bbb0;margin:3px 0 0}
    .nav{display:grid;gap:7px}
    .nav button{border:0;background:transparent;color:#bdd0c5;padding:11px 12px;text-align:left;border-radius:11px}
    .nav button.active,.nav button:hover{background:#1a3a2b;color:#fff}
    .sidebar-footer{margin-top:auto;color:#94aa9d;font-size:12px;line-height:1.5;padding:10px}
    .main{flex:1;min-width:0}
    .topbar{height:72px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
    .crumb{font-size:14px;color:var(--muted)}.crumb b{color:var(--text)}
    .profile{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--brand2);display:grid;place-items:center;font-weight:800}
    .content{max-width:1250px;margin:0 auto;padding:28px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
    .page-head h2{font-size:28px;margin:0 0 7px}.page-head p{margin:0;color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}
    .btn.ghost{background:transparent}.btn.danger{color:var(--danger);border-color:#f1c4bf}
    .hero-grid{display:grid;grid-template-columns:2.1fr 1fr;gap:18px;margin-bottom:18px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{padding:23px}
    .status-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#f1f5f3;color:#506159}
    .pill.green{background:var(--soft);color:var(--brand2)}
    .progress{height:10px;background:#e9efec;border-radius:999px;overflow:hidden}.progress > div{height:100%;background:linear-gradient(90deg,#43bf7a,#157347);border-radius:999px;transition:.2s}
    .progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:7px 0 0}
    .stat{padding:18px}.stat label{color:var(--muted);font-size:12px}.stat strong{font-size:27px;display:block;margin-top:3px}
    .section{margin-top:18px;overflow:hidden}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 19px;border-bottom:1px solid var(--line);background:#fbfcfb}
    .section-title{display:flex;align-items:center;gap:10px}.section-number{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--brand2);display:grid;place-items:center;font-weight:900;font-size:12px}
    .section-head h3{margin:0;font-size:15px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .section-body{padding:19px}
    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .field{min-width:0}.field.full{grid-column:1/-1}
    .field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field label span{color:#84908a;font-weight:600}
    input,select,textarea{width:100%;border:1px solid #d6e0da;background:#fff;border-radius:10px;padding:10px 11px;outline:none;color:var(--text);transition:.15s}
    input:focus,select:focus,textarea:focus{border-color:#74b895;box-shadow:0 0 0 3px rgba(21,115,71,.09)}
    textarea{min-height:82px;resize:vertical}
    input[readonly],select:disabled,textarea[readonly]{background:#f7f9f8;color:#68756f}
    .type-chip{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:10px;background:#eff3f1;color:#68756f;vertical-align:middle}
    .sticky-actions{position:sticky;bottom:15px;margin-top:22px;display:flex;justify-content:flex-end;gap:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:10px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .hidden{display:none!important}
    .toast{position:fixed;right:24px;bottom:24px;padding:12px 15px;border-radius:11px;background:#11251b;color:#fff;box-shadow:var(--shadow);font-size:13px;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}
    .toast.show{opacity:1;transform:translateY(0)}
    .login-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#dff5e8,transparent 38%),#edf3ef;padding:20px}
    .login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 70px rgba(24,59,40,.12);padding:30px}
    .login-card .brand{padding:0 0 25px}.login-card h2{font-size:27px;margin:0 0 7px}.login-card p{color:var(--muted);margin:0 0 22px}
    .login-card .field{margin-bottom:13px}.login-help{font-size:12px;background:#f6faf7;padding:12px;border-radius:11px;line-height:1.6;margin-top:16px}
    .error{color:var(--danger);font-size:12px;margin:8px 0}
    .admin-list{display:grid;gap:12px}
    .admin-row{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff;display:grid;grid-template-columns:1.4fr .9fr 1.2fr auto;gap:10px;align-items:center}
    .admin-row small{color:var(--muted)}
    .empty{padding:35px;text-align:center;color:var(--muted)}
    @media(max-width:980px){.sidebar{width:76px}.brand h1,.brand p,.nav span,.sidebar-footer{display:none}.brand{justify-content:center;padding:8px 0}.topbar{padding:0 18px}.content{padding:18px}.hero-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:650px){.sidebar{display:none}.topbar{position:static}.page-head{flex-direction:column}.form-grid{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr}.actions{width:100%}.btn{flex:1}}
  </style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
const defaultFields = [
  ["Grade","Dropdown"],["BOM Name","Dropdown"],["Shift","Dropdown"],["Heat Status","Dropdown"],["Furnace Name","Dropdown"],["Furnace Capacity","Dropdown"],["Furnace Patching","Dropdown"],["Ladle Name","Dropdown"],["Ladle Capacity","Dropdown"],["Ladle Patching","Dropdown"],["Ladle Status","Dropdown"],["Ladle Preheat Method","Dropdown"],["Number of Tapping","Dropdown"],["Before sampling","Dropdown"],["After sampling","Dropdown"],
  ["Heat No.","Real Time Variable"],["Planned Liquid Weight(kg)","Real Time Variable"],["Proposed Increased weight (%)","Real Time Variable"],["Power Rating (kw)","Real Time Variable"],["GLD (mA)","Real Time Variable"],["Initial Power (kwh)","Real Time Variable"],["Final Power (kwh)","Real Time Variable"],["Ladle Jam (kg)","Real Time Variable"],["Sample Result(%)","Real Time Variable"],["Product Result(%)","Real Time Variable"],["Spillage(kg)","Real Time Variable"],["No. of Persons(nos)","Real Time Variable"],["Melting Supervisor","Real Time Variable"],["Remarks","Real Time Variable"],["Furnace On Time(hh:mm)","Real Time Variable"],["Furnace Off Time(hh:mm)","Real Time Variable"],["1st Tapping Start Time(hh:mm)","Real Time Variable"],["2nd Tapping Start Time(hh:mm)","Real Time Variable"],["3rd Tapping Start Time(hh:mm)","Real Time Variable"],["1st Preheat Start Time(hh:mm)","Real Time Variable"],["1st Preheat End Time(hh:mm)","Real Time Variable"],["2nd Preheat Start Time(hh:mm)","Real Time Variable"],["2nd Preheat End Time(hh:mm)","Real Time Variable"],["3rd Preheat Start Time(hh:mm)","Real Time Variable"],["3rd Preheat End Time(hh:mm)","Real Time Variable"],["Stopper Rod Setting Start Time(hh:mm)","Real Time Variable"],["Stopper Rod Setting End Time(hh:mm)","Real Time Variable"],["Metal Holding Time(hh:mm)","Real Time Variable"],["Ladle Holding Time(hh:mm)","Real Time Variable"],["De-Slagging Sampling Time(hh:mm)","Real Time Variable"],["1st Tapping Temperature(°C)","Real Time Variable"],["2nd Tapping Temperature(°C)","Real Time Variable"],["3rd Tapping Temperature (°C)","Real Time Variable"],["1st Preheat Temperature (°C)","Real Time Variable"],["2nd Preheat Temperature (°C)","Real Time Variable"],["3rd Preheat Temperature(°C)","Real Time Variable"],["Actual Pouring Weight(kg)","Real Time Variable"],["Planned Weight(Casting and TestBar)(kg)","Real Time Variable"],["Total Number of TestBar","Real Time Variable"],["Actual Charge(kg)","Real Time Variable"],["Target Melting Loss (%)","Real Time Variable"],["Target Spillage Loss(%)","Real Time Variable"],["Actual Liquid Metal Tapped(kg)","Real Time Variable"],["Ingot Weight(kg)","Real Time Variable"],
  ["Proposed weight(kg)","Calculations"],["1st Preheat Duration(hh:mm)","Calculations"],["2nd Preheat Duration(hh:mm)","Calculations"],["3rd Preheat Duration(hh:mm)","Calculations"],["BOM % (%)","Calculations"],["Total BOM Charge(kg)","Calculations"],["BOM Charge(kg)","Calculations"],["Total Actual Charge(kg)","Calculations"],["Total Actual Charge (%)","Calculations"],["Actual Charge(%)","Calculations"],["Pouring Weight Deviation(%)","Calculations"],["Actual Melting Loss(kg)","Calculations"],["Calculated Melting Loss(kg)","Calculations"],["Melting Loss% (%)","Calculations"],["Target Spillage (kg)","Calculations"],["Actual Spillage Loss","Calculations"],["Total Furnace Time","Calculations"],["Man Hours","Calculations"],["Man Power/ton","Calculations"],["Deviation","Calculations"],["Correction","Calculations"],
  ["Charge Condition","Selection"]
];

const optionDefaults = {
  "Grade":["5A","CF8","SG Iron","EN-GJS-500"], "BOM Name":["BOM-001","BOM-002","BOM-003"],
  "Shift":["A","B","C"], "Heat Status":["Planned","In Process","Completed"], "Furnace Name":["Furnace-01","Furnace-02"],
  "Furnace Capacity":["1 Ton","2 Ton","5 Ton"], "Furnace Patching":["Good","Required","Under Maintenance"],
  "Ladle Name":["Ladle-01","Ladle-02","Ladle-03"], "Ladle Capacity":["500 kg","1000 kg","1500 kg"],
  "Ladle Patching":["Good","Required","Under Maintenance"], "Ladle Status":["Available","In Use","Maintenance"],
  "Ladle Preheat Method":["Gas","Electric","None"], "Number of Tapping":["1","2","3"], "Before sampling":["Yes","No"],
  "After sampling":["Yes","No"], "Charge Condition":["Dry","Normal","Wet","Mixed"]
};

let fields = JSON.parse(localStorage.getItem("foundry_fields") || "null") ||
  defaultFields.map((x,i)=>({id:i+1,name:x[0],type:x[1],options:optionDefaults[x[0]] || ["Option 1","Option 2","Option 3"]}));

let currentUser = JSON.parse(sessionStorage.getItem("foundry_user") || "null");
let values = JSON.parse(localStorage.getItem("foundry_form_values") || "{}");
let activePage = "form";

function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}
function saveFields(){localStorage.setItem("foundry_fields",JSON.stringify(fields));}
function saveValues(){localStorage.setItem("foundry_form_values",JSON.stringify(values));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function slug(name){return "f_"+name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");}

function loginScreen(){
  document.getElementById("root").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand"><div class="brand-mark">FF</div><div><h1>FoundryFlow</h1><p>Production data capture prototype</p></div></div>
        <h2>Welcome back</h2><p>Sign in to enter or manage foundry production data.</p>
        <div id="loginError" class="error"></div>
        <div class="field"><label>Email ID</label><input id="loginEmail" type="email" placeholder="you@foundry.com"></div>
        <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
        <button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button>
        <div class="login-help">
          <b>Demo accounts</b><br>
          Admin: admin@foundry.com / admin123<br>
          User: user@foundry.com / user123<br>
          <span style="color:#6d7872">Prototype only — credentials are local, not production authentication.</span>
        </div>
      </div>
    </div>`;
}
function login(){
  const e=document.getElementById("loginEmail").value.trim().toLowerCase(), p=document.getElementById("loginPassword").value;
  const accounts=[
    {email:"admin@foundry.com",password:"admin123",role:"admin",name:"Admin User"},
    {email:"user@foundry.com",password:"user123",role:"user",name:"Production User"}
  ];
  const hit=accounts.find(a=>a.email===e && a.password===p);
  if(!hit){document.getElementById("loginError").textContent="Invalid email or password. Use one of the demo accounts.";return}
  currentUser=hit; sessionStorage.setItem("foundry_user",JSON.stringify(hit)); activePage="form"; render();
}
function logout(){sessionStorage.removeItem("foundry_user");currentUser=null;loginScreen()}

function render(){
  if(!currentUser){loginScreen();return}
  document.getElementById("root").innerHTML=`
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">FF</div><div><h1>FoundryFlow</h1><p>Digital shop-floor form</p></div></div>
        <div class="nav">
          <button class="${activePage==='form'?'active':''}" onclick="go('form')">◫ <span>Production Form</span></button>
          ${currentUser.role==='admin'?`<button class="${activePage==='admin'?'active':''}" onclick="go('admin')">⚙ <span>Field Configuration</span></button>`:''}
        </div>
        <div class="sidebar-footer">Prototype v1.0<br>Data is saved in this browser.</div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="crumb">Foundry / <b>${activePage==='form'?'Heat Entry':'Admin Settings'}</b></div>
          <div class="profile"><div><b style="font-size:13px">${esc(currentUser.name)}</b><div style="font-size:11px;color:#6d7872;text-transform:capitalize">${currentUser.role}</div></div><div class="avatar">${esc(currentUser.name[0])}</div><button class="btn ghost" onclick="logout()">Logout</button></div>
        </div>
        <div class="content" id="pageContent"></div>
      </main>
    </div>`;
  activePage==='form'?renderForm():renderAdmin();
}
function go(page){activePage=page;render()}

function groups(){
  return [
    {key:"Dropdown", title:"Setup & Master Data", note:"Choose values from configured lists."},
    {key:"Real Time Variable", title:"Production Entry", note:"Values captured by the operator during the heat."},
    {key:"Calculations", title:"Calculated Results", note:"Prototype shows these as read-only result fields."},
    {key:"Selection", title:"Final Selection", note:"Select the final charge condition."}
  ];
}
function typeInput(f){
  const id=slug(f.name), v=values[id] ?? "";
  const calc=f.type==="Calculations";
  if(f.type==="Dropdown" || f.type==="Selection"){
    const opts=(f.options||["Option 1","Option 2"]).map(o=>`<option ${String(v)===String(o)?"selected":""}>${esc(o)}</option>`).join("");
    return `<select id="${id}" ${calc?"disabled":""} onchange="changeValue('${id}',this.value)"><option value="">Select...</option>${opts}</select>`;
  }
  let kind="text", step="";
  if(/(kg|kw|kwh|%|mA|Temperature|Persons|TestBar)/i.test(f.name)) { kind="number"; step='step="0.01"'; }
  if(/Time|hh:mm/i.test(f.name)) kind="time";
  if(f.name==="Remarks") return `<textarea id="${id}" ${calc?"readonly":""} placeholder="${calc?"Calculated automatically":"Enter remarks..."}" onchange="changeValue('${id}',this.value)">${esc(v)}</textarea>`;
  const calculated=calc ? `readonly placeholder="Auto-calculated in production version"` : `placeholder="Enter ${f.name.toLowerCase()}..."`;
  return `<input id="${id}" type="${kind}" ${step} value="${esc(v)}" ${calculated} onchange="changeValue('${id}',this.value)">`;
}
function changeValue(id,val){values[id]=val;saveValues();updateProgress()}
function renderForm(){
  const all=fields.length, filled=Object.values(values).filter(v=>v!==""&&v!=null).length, pct=Math.round((filled/all)*100);
  document.getElementById("pageContent").innerHTML=`
    <div class="page-head">
      <div><h2>Heat Production Entry</h2><p>Enter the heat details in the same flow an operator would follow on the shop floor.</p></div>
      <div class="actions"><button class="btn" onclick="clearForm()">Reset Form</button><button class="btn primary" onclick="submitForm()">Save Heat Entry</button></div>
    </div>
    <div class="hero-grid">
      <div class="card hero">
        <div class="status-row"><span class="pill green">● Draft</span><span class="pill">${currentUser.role==='admin'?'Full Admin Access':'Operator Access'}</span><span class="pill">${all} fields</span></div>
        <h3 style="margin:0 0 5px">Heat entry progress</h3>
        <div style="color:#6d7872;font-size:12px;margin-bottom:12px">Complete the form from setup values to final charge condition.</div>
        <div class="progress"><div id="progressBar" style="width:${pct}%"></div></div>
        <div class="progress-meta"><span id="progressText">${filled} of ${all} fields completed</span><span id="progressPct">${pct}%</span></div>
      </div>
      <div class="card stat"><label>Next step</label><strong>${pct<100?'Continue entering data':'Ready to submit'}</strong><div style="color:#6d7872;font-size:12px;margin-top:7px">${pct<100?'Dropdowns are fastest to complete. Calculations are intentionally read-only in this prototype.':'Review the entry and save the heat.'}</div></div>
    </div>
    ${groups().map((g,i)=>{
      const fs=fields.filter(f=>f.type===g.key);
      if(!fs.length)return "";
      return `<section class="card section"><div class="section-head"><div class="section-title"><div class="section-number">${i+1}</div><div><h3>${g.title}</h3><p>${g.note}</p></div></div><span class="pill">${fs.length} fields</span></div><div class="section-body"><div class="form-grid">${fs.map(f=>`<div class="field ${f.name==='Remarks'?'full':''}"><label>${esc(f.name)} <span class="type-chip">${esc(f.type)}</span></label>${typeInput(f)}</div>`).join("")}</div></div></section>`
    }).join("")}
    <div class="sticky-actions"><button class="btn" onclick="clearForm()">Reset</button><button class="btn primary" onclick="submitForm()">Save Heat Entry</button></div>`;
}
function updateProgress(){
  const all=fields.length, filled=Object.values(values).filter(v=>v!==""&&v!=null).length, pct=Math.round((filled/all)*100);
  const bar=document.getElementById("progressBar"), txt=document.getElementById("progressText"), pp=document.getElementById("progressPct");
  if(bar){bar.style.width=pct+"%";txt.textContent=`${filled} of ${all} fields completed`;pp.textContent=pct+"%";}
}
function clearForm(){if(confirm("Reset all entered values for this browser?")){values={};saveValues();render();toast("Form reset");}}
function submitForm(){saveValues();toast("Heat entry saved locally ✓");}
function renderAdmin(){
  document.getElementById("pageContent").innerHTML=`
    <div class="page-head">
      <div><h2>Field Configuration</h2><p>Admin can edit field names, types, and dropdown options. Changes are saved in this browser.</p></div>
      <div class="actions"><button class="btn" onclick="resetFields()">Restore Defaults</button><button class="btn primary" onclick="addField()">+ Add Field</button></div>
    </div>
    <div class="card" style="padding:18px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="pill green">${fields.length} total fields</span><span class="pill">${fields.filter(f=>f.type==='Dropdown').length} dropdowns</span><span class="pill">${fields.filter(f=>f.type==='Real Time Variable').length} live inputs</span><span class="pill">${fields.filter(f=>f.type==='Calculations').length} calculations</span></div>
      <div class="admin-list">
      ${fields.map((f,i)=>`<div class="admin-row">
        <div><b>${i+1}. ${esc(f.name)}</b><br><small>ID: ${esc(slug(f.name))}</small></div>
        <select onchange="adminType(${f.id},this.value)">
          ${["Dropdown","Real Time Variable","Calculations","Selection"].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join("")}
        </select>
        ${(f.type==='Dropdown'||f.type==='Selection')?`<input value="${esc((f.options||[]).join(', '))}" onchange="adminOptions(${f.id},this.value)" title="Comma-separated options">`:`<input value="${esc(f.name)}" onchange="adminName(${f.id},this.value)" title="Edit field name">`}
        <button class="btn danger" onclick="deleteField(${f.id})">Delete</button>
      </div>`).join("")}
      </div>
    </div>
    <div class="card" style="padding:18px;margin-top:18px;background:#f9fbfa">
      <b>Prototype behavior</b>
      <p style="color:#6d7872;font-size:13px;line-height:1.6;margin-bottom:0">Admin configuration currently uses localStorage. In a production build, this screen would connect to a database/API so every operator sees the same field configuration and permissions can be enforced securely on the server.</p>
    </div>`;
}
function adminType(id,v){const f=fields.find(x=>x.id===id);if(f){f.type=v;saveFields();renderAdmin();toast("Field type updated");}}
function adminName(id,v){const f=fields.find(x=>x.id===id);if(f){f.name=v.trim()||f.name;saveFields();renderAdmin();}}
function adminOptions(id,v){const f=fields.find(x=>x.id===id);if(f){f.options=v.split(",").map(x=>x.trim()).filter(Boolean);saveFields();renderAdmin();}}
function deleteField(id){if(!confirm("Delete this field?"))return;fields=fields.filter(f=>f.id!==id);saveFields();renderAdmin();toast("Field deleted");}
function addField(){const id=Date.now();fields.push({id,name:"New Field",type:"Real Time Variable",options:["Option 1","Option 2"]});saveFields();renderAdmin();toast("New field added");}
function resetFields(){if(!confirm("Restore the original 81-field configuration?"))return;fields=defaultFields.map((x,i)=>({id:i+1,name:x[0],type:x[1],options:optionDefaults[x[0]]||["Option 1","Option 2","Option 3"]}));saveFields();renderAdmin();toast("Defaults restored");}

render();
</script>
</body>
</html>
